<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
<title>Flappy Clone</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: linear-gradient(180deg,#7dd3fc,#bae6fd 60%,#fef9c3);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: #0c4a6e;
  }
  .wrap { text-align: center; padding: 16px; }
  h1 { margin: 0 0 8px; font-size: 1.8rem; letter-spacing: -0.02em; }
  h1 span { background:#facc15; padding: 2px 10px; border-radius: 999px; border: 3px solid #0c4a6e; }
  #game {
    border: 4px solid #0c4a6e; border-radius: 18px;
    box-shadow: 0 12px 30px rgba(12,74,110,.25);
    background: #87ceeb; touch-action: none; cursor: pointer;
    max-width: 92vw; height: auto;
  }
  .hud { display: flex; gap: 10px; justify-content: center; margin: 12px 0; }
  .pill {
    background: #fff; border: 2px solid #0c4a6e; border-radius: 999px;
    padding: 6px 14px; font-weight: 800;
  }
  button {
    padding: 10px 18px; border-radius: 12px; border: 3px solid #0c4a6e;
    background: #facc15; font-weight: 800; font-size: 1rem; cursor: pointer;
  }
  button:active { transform: scale(.97); }
  .hint { opacity: .7; font-size: .9rem; margin-top: 8px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>🐤 <span>Flappy Clone</span></h1>
  <div class="hud">
    <div class="pill">Score: <span id="score">0</span></div>
    <div class="pill">Best: <span id="best">0</span></div>
  </div>
  <canvas id="game" width="400" height="600"></canvas>
  <div style="margin-top:12px">
    <button id="restartBtn">↻ Restart</button>
  </div>
  <div class="hint">Press Space / Click / Tap to flap</div>
</div>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');
const bestEl = document.getElementById('best');

const W = canvas.width, H = canvas.height;
let best = +(localStorage.getItem('flappy-best') || 0);
bestEl.textContent = best;

let bird, pipes, score, frame, dead, started;

function reset() {
  bird = { x: 80, y: H/2, vy: 0, r: 14 };
  pipes = [];
  score = 0;
  frame = 0;
  dead = false;
  started = false;
  scoreEl.textContent = '0';
}

const GRAV = 0.28;
const FLAP = -5.8;
const MAX_FALL = 6;
const PIPE_W = 62;
const GAP = 155;
const SPEED = 1.5;

function flap() {
  if (dead) { reset(); loop(); return; }
  started = true;
  bird.vy = FLAP;
}

function spawnPipe() {
  const margin = 60;
  const gapY = margin + Math.random() * (H - GAP - margin*2 - 80);
  pipes.push({ x: W, gapY, passed: false });
}

function update() {
  frame++;
  if (!started) return;
  bird.vy += GRAV;
  if (bird.vy > MAX_FALL) bird.vy = MAX_FALL;
  bird.y += bird.vy;

  if (frame % 125 === 0) spawnPipe();

  for (const p of pipes) {
    p.x -= SPEED;
    if (!p.passed && p.x + PIPE_W < bird.x) {
      p.passed = true;
      score++;
      scoreEl.textContent = score;
      if (score > best) {
        best = score;
        bestEl.textContent = best;
        localStorage.setItem('flappy-best', best);
      }
    }
  }
  pipes = pipes.filter(p => p.x + PIPE_W > -10);

  // collisions
  if (bird.y + bird.r >= H - 40 || bird.y - bird.r <= 0) return die();
  for (const p of pipes) {
    const inX = bird.x + bird.r > p.x && bird.x - bird.r < p.x + PIPE_W;
    if (inX && (bird.y - bird.r < p.gapY || bird.y + bird.r > p.gapY + GAP)) return die();
  }
}

function die() {
  dead = true;
}

function draw() {
  // sky
  const g = ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#38bdf8'); g.addColorStop(1,'#e0f2fe');
  ctx.fillStyle = g;
  ctx.fillRect(0,0,W,H);

  // clouds
  ctx.fillStyle = 'rgba(255,255,255,.9)';
  const cx = (frame*0.3) % (W+120);
  for (let i=0;i<3;i++) {
    const x = ((i*180 - cx) + W+120) % (W+120) - 60;
    const y = 70 + i*55;
    ctx.beginPath();
    ctx.arc(x,y,22,0,7); ctx.arc(x+22,y+4,18,0,7); ctx.arc(x-22,y+4,16,0,7);
    ctx.fill();
  }

  // pipes
  for (const p of pipes) {
    ctx.fillStyle = '#22c55e';
    ctx.strokeStyle = '#0c4a6e';
    ctx.lineWidth = 3;
    roundRect(p.x, 0, PIPE_W, p.gapY, 8); ctx.fill(); ctx.stroke();
    roundRect(p.x, p.gapY+GAP, PIPE_W, H-p.gapY-GAP-40, 8); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#16a34a';
    ctx.fillRect(p.x+6, Math.max(0,p.gapY-18), PIPE_W-12, 18);
    ctx.fillRect(p.x+6, p.gapY+GAP, PIPE_W-12, 18);
  }

  // ground
  ctx.fillStyle = '#fde68a';
  ctx.fillRect(0, H-40, W, 40);
  ctx.fillStyle = '#22c55e';
  ctx.fillRect(0, H-40, W, 10);
  ctx.fillStyle = 'rgba(12,74,110,.15)';
  for (let x = -((frame*SPEED)%24); x<W; x+=24) ctx.fillRect(x, H-18, 12, 18);

  // bird
  const bob = started ? 0 : Math.sin(frame*0.1)*6;
  const by = bird.y + (started?0:bob);
  ctx.save();
  ctx.translate(bird.x, by);
  ctx.rotate(Math.max(-0.4, Math.min(0.6, bird.vy*0.06)));
  // body
  ctx.fillStyle = '#facc15';
  ctx.strokeStyle = '#0c4a6e'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.arc(0,0,bird.r,0,7); ctx.fill(); ctx.stroke();
  // eye
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(5,-4,6,0,7); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#0c4a6e';
  ctx.beginPath(); ctx.arc(7,-4,3,0,7); ctx.fill();
  // beak
  ctx.fillStyle = '#fb923c';
  ctx.beginPath();
  ctx.moveTo(10,2); ctx.lineTo(20,5); ctx.lineTo(10,9); ctx.closePath();
  ctx.fill(); ctx.stroke();
  // wing
  ctx.fillStyle = '#fde68a';
  ctx.beginPath(); ctx.ellipse(-4,5,8,5,-0.4,0,7); ctx.fill(); ctx.stroke();
  ctx.restore();

  // overlays
  if (!started && !dead) {
    centerText('Tap / Space to start', H/2 - 60);
    centerText('🐤', H/2 - 110, '40px');
  }
  if (dead) {
    ctx.fillStyle = 'rgba(12,74,110,.55)';
    ctx.fillRect(0,0,W,H);
    centerText('💥 Game Over', H/2-40, '32px', '#fff');
    centerText(`Score: ${score}`, H/2, '20px', '#fef9c3');
    centerText('Tap / Space to retry', H/2+40, '16px', '#fff');
  } else if (started) {
    ctx.fillStyle = '#fff';
    ctx.strokeStyle = '#0c4a6e'; ctx.lineWidth = 4;
    ctx.font = '800 42px system-ui';
    ctx.textAlign = 'center';
    ctx.strokeText(score, W/2, 70);
    ctx.fillText(score, W/2, 70);
  }
}

function centerText(t, y, size='20px', color='#0c4a6e') {
  ctx.font = `800 ${size} system-ui`;
  ctx.textAlign = 'center';
  ctx.fillStyle = color;
  ctx.fillText(t, W/2, y);
}

function roundRect(x,y,w,h,r) {
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}

let raf;
function loop() {
  cancelAnimationFrame(raf);
  function tick() {
    update();
    draw();
    if (!dead) raf = requestAnimationFrame(tick);
  }
  tick();
}

window.addEventListener('keydown', e => {
  if (e.code === 'Space' || e.code === 'ArrowUp') { e.preventDefault(); flap(); if(dead){reset();loop();} else loop(); }
});
canvas.addEventListener('pointerdown', () => { const wasDead = dead; flap(); if(wasDead){reset(); started=true; loop();} });
document.getElementById('restartBtn').onclick = () => { reset(); loop(); };

reset();
draw();
</script>
</body>
</html>
